name: app-native

# Unsigned debug builds of the TokenHub APP install packages (native/).
# Manual only: proves the shells compile on each platform; signing and store
# distribution are configured per deployment (docs/app-admin.md, Q6).
on:
  workflow_dispatch:
    inputs:
      targets:
        description: "Comma-separated: android, ios, desktop"
        required: false
        default: "android,ios,desktop"

jobs:
  android:
    if: contains(github.event.inputs.targets, 'android')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native/capacitor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Generate the Android project
        run: |
          npm install --no-audit --no-fund
          npm run add:android
          npx cap sync android
      - name: Build debug APK
        working-directory: native/capacitor/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: tokenhub-android-debug
          path: native/capacitor/android/app/build/outputs/apk/debug/*.apk

  ios:
    if: contains(github.event.inputs.targets, 'ios')
    runs-on: macos-14
    defaults:
      run:
        working-directory: native/capacitor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Generate the iOS project
        run: |
          npm install --no-audit --no-fund
          npm run add:ios
          npx cap sync ios
      - name: Build for the simulator (unsigned)
        working-directory: native/capacitor/ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build

  desktop:
    if: contains(github.event.inputs.targets, 'desktop')
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: native/tauri
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build (unsigned)
        run: |
          npm install --no-audit --no-fund
          npm run icon
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: tokenhub-desktop-${{ matrix.os }}
          path: |
            native/tauri/src-tauri/target/release/bundle/dmg/*.dmg
            native/tauri/src-tauri/target/release/bundle/msi/*.msi
            native/tauri/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
