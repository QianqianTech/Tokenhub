name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    # Behaviour tests without MySQL: SSE parsing, usage normalisation, quota
    # lifecycle, queue atomicity, outbound policy, routing policy, credentials.
    # Runs on every supported PHP minor (README: 8.2 - 8.5, 8.4 recommended).
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4"]
    services:
      redis:
        image: redis:7.4
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: redis, pdo_mysql, mbstring, openssl
      - name: Lint
        run: find app bin scripts tests -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
      - name: Unit behaviour tests
        env:
          REDIS_HOST: 127.0.0.1
        run: php bin/run-unit-tests.php
      - name: TokenHub APP contract tests (database-free)
        run: |
          set -e
          for f in tests/Support/App*Test.php; do
            echo "== $f"
            php "$f"
          done

  admin-e2e:
    # Browser tests of the admin console and the TokenHub APP (/app/) against
    # the in-memory mock API (tests/e2e/mock-server.mjs); no database needed.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Playwright
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Admin console and APP browser tests
        run: npm test

  integration:
    # Full suite on MySQL + Redis, required on every push and pull request
    # (REL-105 / APP-103). Qdrant-dependent RAG E2E tests need the compose
    # stack and are not run here.
    runs-on: ubuntu-latest
    continue-on-error: false
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: tokenhub
          MYSQL_USER: tokenhub
          MYSQL_PASSWORD: tokenhub_secret
          MYSQL_ROOT_PASSWORD: root_secret
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot_secret" --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      APP_ENV: testing
      APP_KEY: ci-only-key-0123456789abcdef0123456789
      DB_HOST: 127.0.0.1
      DB_DATABASE: tokenhub
      DB_USERNAME: tokenhub
      DB_PASSWORD: tokenhub_secret
      REDIS_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: redis, pdo_mysql, mbstring, openssl, gd, zip
          tools: composer
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Schema
        run: |
          mysql -h 127.0.0.1 -utokenhub -ptokenhub_secret tokenhub < database/migrations/0001_create_tokenhub_schema.sql
          php bin/migrate.php
      - name: TokenHub APP database tests
        run: |
          set -e
          for f in tests/Services/App*Test.php; do
            echo "== $f"
            php "$f"
          done
      - name: Full test suite
        run: php tests/run.php

  rag-worker:
    # Python RAG worker unit tests (no MySQL / Qdrant needed).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python-rag-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python-rag-worker/requirements.txt
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q tests

  dependency-audit:
    # Known vulnerabilities in locked PHP and Python dependencies (SEC-115).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer
      - name: composer audit
        run: composer audit --locked --no-interaction
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - name: pip-audit (RAG worker)
        run: |
          pip-audit --progress-spinner off -r python-rag-worker/requirements.txt
          pip-audit --progress-spinner off -r python-rag-worker/requirements-ocr.txt
