<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TokenHub 管理后台</title>
    <link rel="stylesheet" href="/admin/assets/css/app.css?v=20260717-multiselect-checkbox-v2">
  </head>
  <body>
    <main id="app" class="app-shell theme-light is-login">
      <aside id="sidebar" class="sidebar" aria-label="管理菜单">
        <div class="sidebar-header">
          <div class="brand">TokenHub</div>
          <button id="sidebar-mode-toggle" type="button" class="sidebar-mode-toggle" aria-label="收起菜单" aria-pressed="false">‹</button>
        </div>
        <nav id="nav" aria-label="主导航"></nav>
      </aside>
      <button id="sidebar-backdrop" class="sidebar-backdrop" type="button" aria-label="关闭菜单" hidden></button>
      <section class="workspace">
        <header class="topbar">
          <div class="topbar-title">
            <button id="sidebar-toggle" class="sidebar-toggle" type="button" aria-label="打开菜单" aria-controls="sidebar" aria-expanded="false">☰</button>
            <h1 id="page-title">智慧分析</h1>
            <span id="request-id" hidden></span>
          </div>
          <div class="topbar-actions">
            <div id="theme-switcher" class="theme-switcher" aria-label="界面主题">
              <button type="button" class="theme-choice" data-theme-choice="dark" aria-pressed="false" aria-label="深色主题" title="切换为深色主题"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5 8.5 8.5 0 1 0 20.5 14.2Z"/></svg></button>
              <button type="button" class="theme-choice" data-theme-choice="light" aria-pressed="false" aria-label="浅色主题" title="切换为浅色主题"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg></button>
              <button type="button" class="theme-choice active" data-theme-choice="auto" aria-pressed="true" aria-label="自适应主题" title="跟随系统主题"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 12h18M12 4v16"/></svg></button>
            </div>
            <span id="current-user"></span>
            <button id="logout" type="button">退出</button>
          </div>
        </header>
        <section id="global-error" class="global-error"></section>
        <section id="login" class="login-panel">
          <div id="login-brand" class="login-brand">TokenHub</div>
          <h2 id="login-title">管理员登录</h2>
          <label>用户名<input id="username" autocomplete="username"></label>
          <label>密码<input id="password" type="password" autocomplete="current-password"></label>
          <button id="login-button" type="button">登录</button>
          <p id="login-error" class="error"></p>
        </section>
        <section id="content" class="content" hidden></section>
        <div id="modal-root"></div>
        <div class="app-copyright" aria-label="版权信息">黔前智算 TokenHub 版权所有</div>
      </section>
    </main>
    <script type="module" src="/admin/assets/js/app.js?v=20260717-multiselect-checkbox-v2"></script>
  </body>
</html>
