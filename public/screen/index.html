<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>白云区智慧政务 运营大屏</title>
    <link rel="stylesheet" href="/screen/assets/screen.css">
  </head>
  <body>
    <main class="screen-shell">
      <section id="login" class="login screen-login">
        <div class="login-brand">
          <span class="brand-kicker">白云区智慧政务</span>
          <h1>运营大屏</h1>
          <p id="entry-status">正在进入大屏</p>
        </div>
        <div id="credential-fields" hidden>
          <label>用户名<input id="username" autocomplete="username"></label>
          <label>密码<input id="password" type="password" autocomplete="current-password"></label>
        </div>
        <button id="login-button" type="button">进入大屏</button>
        <p id="error"></p>
      </section>

      <section id="screen" class="screen-stage" hidden>
        <header class="screen-topline">
          <div>
            <span class="screen-kicker">实时 Token 监测</span>
            <h1 class="screen-title">白云区智慧政务 运营大屏</h1>
            <p class="screen-subtitle">Token 消耗、调用、生成任务与性能状态一屏掌握</p>
          </div>
          <div class="screen-toolbar">
            <div id="screen-clock" class="screen-clock">--:--:--</div>
            <div id="screen-status" class="screen-status">等待刷新</div>
            <button id="fullscreen-toggle" class="secondary-button" type="button">全屏</button>
            <button id="logout" type="button">退出</button>
          </div>
        </header>

        <section class="screen-view active" data-screen-view="overview">
          <section class="screen-overview">
            <article class="panel token-flow-panel">
              <h2>实时 Token 消耗</h2>
              <div id="token-summary" class="metrics metric-grid"></div>
            </article>
            <article class="panel token-detail-panel">
              <h2>Token 细节</h2>
              <div id="token-details" class="token-details"></div>
            </article>
          </section>

          <section class="screen-grid screen-primary-grid">
            <article class="panel">
              <h2>大模型 Token 占比</h2>
              <div id="model-share-chart" class="model-chart"></div>
            </article>
            <article class="panel">
              <h2>大模型使用排行</h2>
              <div id="model-usage" class="model-list"></div>
            </article>
            <article class="panel">
              <h2>周期总词元量</h2>
              <div id="period-totals" class="period-grid"></div>
            </article>
            <article class="panel">
              <h2>正在生成</h2>
              <div id="live-generations" class="live-list"></div>
            </article>
          </section>
        </section>

        <section class="screen-view" data-screen-view="operations">
          <section class="screen-grid screen-secondary-grid">
            <article class="panel panel-wide">
              <h2>调用趋势</h2>
              <div id="trends" class="trend-bars"></div>
            </article>
            <article class="panel">
              <h2>调用排行</h2>
              <div id="rankings" class="rank-list"></div>
            </article>
            <article class="panel panel-wide">
              <h2>性能</h2>
              <div id="performance" class="performance-grid"></div>
            </article>
            <article class="panel">
              <h2>安全</h2>
              <div id="security" class="security-list"></div>
            </article>
          </section>
        </section>

        <section class="screen-view" data-screen-view="firewall">
          <section class="firewall-hero">
            <article class="panel firewall-summary-panel">
              <h2>防火墙态势</h2>
              <div id="firewall-summary" class="firewall-summary-grid"></div>
            </article>
            <article class="panel firewall-events-panel">
              <h2>最新安全事件</h2>
              <div id="firewall-events" class="firewall-event-list"></div>
            </article>
          </section>

          <section class="screen-grid firewall-grid">
            <article class="panel">
              <h2>动作命中排行</h2>
              <div id="firewall-rules" class="firewall-rank-list"></div>
            </article>
            <article class="panel">
              <h2>来源 IP 排行</h2>
              <div id="firewall-sources" class="firewall-rank-list"></div>
            </article>
          </section>
        </section>
      </section>
    </main>
    <script type="module" src="/screen/assets/screen.js"></script>
  </body>
</html>
