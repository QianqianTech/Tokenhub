services:
  php:
    image: tokenhub-php:${TOKENHUB_RELEASE_TAG:?TOKENHUB_RELEASE_TAG must be set}
    working_dir: /srv/app
    volumes:
      - tokenhub_storage:/srv/app/storage
      - caddy_data:/srv/caddy-data:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    environment:
      APP_ENV: production
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      CADDY_DATA_PATH: /srv/caddy-data
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      QDRANT_COLLECTION_PREFIX: ${QDRANT_COLLECTION_PREFIX:-tokenhub_rag}
    healthcheck:
      test: ["CMD", "php", "-v"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  queue-worker:
    image: tokenhub-php:${TOKENHUB_RELEASE_TAG:?TOKENHUB_RELEASE_TAG must be set}
    working_dir: /srv/app
    command: php bin/queue-worker.php
    volumes:
      - tokenhub_storage:/srv/app/storage
      - caddy_data:/srv/caddy-data:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      CADDY_DATA_PATH: /srv/caddy-data
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      QDRANT_COLLECTION_PREFIX: ${QDRANT_COLLECTION_PREFIX:-tokenhub_rag}
    restart: unless-stopped

  rag-worker:
    image: tokenhub-rag-worker:${TOKENHUB_RELEASE_TAG:?TOKENHUB_RELEASE_TAG must be set}
    working_dir: /worker
    command: python -m tokenhub_rag_worker
    volumes:
      - tokenhub_storage:/srv/app/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-tokenhub}
      DB_USERNAME: ${DB_USERNAME:-tokenhub}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      QDRANT_COLLECTION_PREFIX: ${QDRANT_COLLECTION_PREFIX:-tokenhub_rag}
      RAG_WORKER_POLL_INTERVAL_SECONDS: ${RAG_WORKER_POLL_INTERVAL_SECONDS:-2}
      RAG_WORKER_BATCH_SIZE: ${RAG_WORKER_BATCH_SIZE:-5}
      RAG_WORKER_ENABLE_LOCAL_FALLBACK: ${RAG_WORKER_ENABLE_LOCAL_FALLBACK:-true}
      RAG_WORKER_STORAGE_ROOT: /srv/app/storage
    healthcheck:
      test: ["CMD", "python", "-m", "tokenhub_rag_worker", "--healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  worker-autoscaler:
    profiles: ["autoscaling"]
    image: tokenhub-worker-autoscaler:${TOKENHUB_RELEASE_TAG:?TOKENHUB_RELEASE_TAG must be set}
    command: /usr/local/bin/worker-autoscaler
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      redis:
        condition: service_healthy
      queue-worker:
        condition: service_started
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      QUEUE_NAME: ${QUEUE_NAME:-tokenhub:jobs}
      WORKER_AUTOSCALE_MIN: ${WORKER_AUTOSCALE_MIN:-2}
      WORKER_AUTOSCALE_MAX: ${WORKER_AUTOSCALE_MAX:-8}
      WORKER_AUTOSCALE_TASKS_PER_WORKER: ${WORKER_AUTOSCALE_TASKS_PER_WORKER:-50}
      WORKER_AUTOSCALE_INTERVAL_SECONDS: ${WORKER_AUTOSCALE_INTERVAL_SECONDS:-15}
      WORKER_AUTOSCALE_COOLDOWN_SECONDS: ${WORKER_AUTOSCALE_COOLDOWN_SECONDS:-300}
      TOKENHUB_COMPOSE_PROJECT_DIR: /srv/app
      TOKENHUB_COMPOSE_FILE: /srv/app/docker-compose.offline.yml
      TOKENHUB_COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-tokenhub}
    restart: unless-stopped

  caddy:
    image: tokenhub-caddy:${TOKENHUB_RELEASE_TAG:?TOKENHUB_RELEASE_TAG must be set}
    ports:
      - "127.0.0.1:${CADDY_HTTP_PORT:-8080}:80"
      - "127.0.0.1:${CADDY_HTTPS_PORT:-8443}:443"
    volumes:
      - tokenhub_storage:/srv/app/storage
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      php:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: tokenhub-mysql:${TOKENHUB_RELEASE_TAG:?TOKENHUB_RELEASE_TAG must be set}
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-tokenhub}
      MYSQL_USER: ${DB_USERNAME:-tokenhub}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD must be set}
    volumes:
      - mysql_97_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: tokenhub-redis:${TOKENHUB_RELEASE_TAG:?TOKENHUB_RELEASE_TAG must be set}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  qdrant:
    image: tokenhub-qdrant:${TOKENHUB_RELEASE_TAG:?TOKENHUB_RELEASE_TAG must be set}
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  tokenhub_storage:
  mysql_97_data:
  redis_data:
  qdrant_data:
  caddy_data:
  caddy_config:
