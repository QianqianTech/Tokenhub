<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src https:">
    <title>TokenHub</title>
    <style>
      :root { color-scheme: light dark; --bg: #151A21; --fg: #f4f7f6; --muted: #8e9a95; --accent: #34D399; --field: #1b222b; --line: #262f39; }
      body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--fg); font: 15px/1.55 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
             padding: calc(24px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom)); box-sizing: border-box; }
      main { max-width: 440px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
      h1 { font-size: 22px; margin: 8px 0 0; text-align: center; }
      .logo { align-self: center; width: 72px; height: 72px; }
      textarea { width: 100%; box-sizing: border-box; min-height: 92px; border-radius: 10px; border: 1px solid var(--line); background: var(--field); color: var(--fg); padding: 10px; font: inherit; }
      button { min-height: 44px; border: 0; border-radius: 10px; background: var(--accent); color: #0e1217; font-weight: 600; font-size: 16px; }
      button.link { background: transparent; color: var(--accent); min-height: 36px; }
      .muted { color: var(--muted); font-size: 13px; }
      .error { color: #fb923c; min-height: 1.2em; margin: 0; }
      ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
      li button { width: 100%; text-align: left; padding: 0 14px; background: var(--field); color: var(--fg); font-weight: 500; }
    </style>
  </head>
  <body>
    <main>
      <svg class="logo" viewBox="0 0 250 250" aria-hidden="true"><rect width="250" height="250" rx="56" fill="#151A21"/><path fill="#34D399" fill-rule="evenodd" d="M90.5 78L117.5 78L147.5 172L129 172L121.4 147.5L87 147.5L80 172L61.5 172ZM103.5 90L116.4 131.5L91.6 131.5Z"/><path fill="#236D57" d="M163 78H181A7 7 0 0 1 188 85V134A7 7 0 0 1 181 141H163A7 7 0 0 1 156 134V85A7 7 0 0 1 163 78Z"/><path fill="#34D399" d="M163 149H181A7 7 0 0 1 188 156V165A7 7 0 0 1 181 172H163A7 7 0 0 1 156 165V156A7 7 0 0 1 163 149Z"/></svg>
      <h1>TokenHub</h1>
      <section id="servers" hidden>
        <p class="muted">已添加的服务器</p>
        <ul id="server-list"></ul>
      </section>
      <p class="muted">在电脑上打开 TokenHub 后台，点左下角「APP 设备」生成认证链接，粘贴到下面。</p>
      <textarea id="link" placeholder="https://…/app/link#c=thl_…" autocomplete="off" spellcheck="false"></textarea>
      <p id="error" class="error" role="alert"></p>
      <button id="go" type="button">登录</button>
    </main>
    <script src="shell.js"></script>
  </body>
</html>
